name: Image Scan

on:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fahim017803/mdfahim.dev:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          
name: DevSecOps Pipeline

on:
  push:
    branches: [main, staging]

jobs:

  # ── Security & Quality Scans (parallel) ────────────────────────────────────

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit

  code-quality:
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  docker-lint:
    uses: ./.github/workflows/docker-lint.yml
    secrets: inherit

  dependency-scan:
    uses: ./.github/workflows/dependencies-scan.yml
    secrets: inherit

  # ── Docker Build & Push (only after ALL scans pass) ────────────────────────

  build:
    needs: [secret-scan, code-quality, docker-lint, dependency-scan]
    uses: ./.github/workflows/docker-push.yml
    secrets: inherit

  trivy:
    needs: [build]
    uses: ./.github/workflows/image-scan.yml
    secrets: inherit
    